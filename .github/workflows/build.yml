name: Build

on:
  push:
    branches: [master]
    tags: ['[0-9]+.[0-9]+.[0-9]+*']
    paths-ignore: &paths-ignore
      - '**.md'
      - LICENSE
      - .gitignore
      - .github/FUNDING.yml
  pull_request:
    paths-ignore: *paths-ignore
  workflow_dispatch:
    inputs:
      version:
        description: 'Publish this version to Maven Central (X.Y.Z or X.Y.Z-SNAPSHOT, leave empty to only build)'
        required: false

permissions:
  contents: read

jobs:
  # ---------- Native builds ----------

  android-native:
    name: android/${{ matrix.abi }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
            cc: armv7a-linux-androideabi16-clang
          - abi: arm64-v8a
            target: aarch64-linux-android
            cc: aarch64-linux-android21-clang
          - abi: x86
            target: i686-linux-android
            cc: i686-linux-android16-clang
          - abi: x86_64
            target: x86_64-linux-android
            cc: x86_64-linux-android21-clang
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: ${{ matrix.target }}
          cache-key: android-${{ matrix.target }}
          rustflags: ""
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Install pinned Android NDK
        run: echo y | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;21.3.6528147"

      - name: Put NDK toolchain on PATH
        run: echo "$ANDROID_HOME/ndk/21.3.6528147/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Build
        env:
          CC: ${{ matrix.cc }}
        run: |
          triple_upper=$(echo "${{ matrix.target }}" | tr 'a-z-' 'A-Z_')
          export "CARGO_TARGET_${triple_upper}_LINKER=${{ matrix.cc }}"
          mkdir -p "$RUNNER_TEMP/libunwind-stub"
          printf '!<arch>\n' > "$RUNNER_TEMP/libunwind-stub/libunwind.a"
          export RUSTFLAGS="-L $RUNNER_TEMP/libunwind-stub -C link-arg=-Wl,-z,max-page-size=16384"
          cargo build --locked --target ${{ matrix.target }} --release

      - name: Upload native lib
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-${{ matrix.abi }}
          path: target/${{ matrix.target }}/release/libetebase_jni.so
          if-no-files-found: error

      - name: Upload generated Java (once)
        if: matrix.abi == 'arm64-v8a'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-generated-java
          path: client/src/main/java/com/etebase/client/*.java
          if-no-files-found: error

  desktop-native:
    name: desktop/${{ matrix.subdir }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            subdir: macos-aarch64
            target: aarch64-apple-darwin
            libfile: libetebase_jni.dylib
          - runner: macos-26
            subdir: macos-x86_64
            target: x86_64-apple-darwin
            libfile: libetebase_jni.dylib
          - runner: ubuntu-22.04
            subdir: linux-x86_64
            target: x86_64-unknown-linux-gnu
            libfile: libetebase_jni.so
          - runner: ubuntu-22.04-arm
            subdir: linux-aarch64
            target: aarch64-unknown-linux-gnu
            libfile: libetebase_jni.so
          - runner: windows-2025
            subdir: windows-x86_64
            target: x86_64-pc-windows-msvc
            libfile: etebase_jni.dll
          - runner: ubuntu-24.04
            subdir: windows-aarch64
            target: aarch64-pc-windows-gnullvm
            libfile: etebase_jni.dll
            zig: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: ${{ matrix.target }}
          cache-key: desktop-${{ matrix.target }}
          rustflags: ""
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Build
        if: ${{ !matrix.zig }}
        shell: bash
        run: cargo build --locked --target ${{ matrix.target }} --release --no-default-features --features jvm

      - name: Install cargo-zigbuild
        if: matrix.zig
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --require-hashes -r zig-requirements.txt
          echo "$RUNNER_TEMP/zig/bin" >> $GITHUB_PATH

      - name: Build (zig)
        if: matrix.zig
        env:
          ZIG: python3 -m ziglang
        run: ./build-windows-aarch64.sh

      - name: Upload native lib
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.subdir }}
          path: target/${{ matrix.target }}/release/${{ matrix.libfile }}
          if-no-files-found: error

      - name: Upload generated Java (once)
        if: matrix.subdir == 'linux-x86_64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-generated-java
          path: client-jvm/src/main/java/com/etebase/client/*.java
          if-no-files-found: error

  # ---------- Assembly ----------

  assemble:
    name: Assemble
    needs: [android-native, desktop-native]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Install pinned Android NDK
        run: echo y | JAVA_HOME="$JAVA_HOME_17_X64" $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;21.3.6528147"

      - name: Download native libs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts/

      - name: Stage native libs and generated Java
        run: ./stage-natives.sh artifacts

      - name: Assemble
        run: ./gradlew :client:assembleRelease :client-jvm:assemble

      - name: Upload AAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: etebase-client-aar
          path: client/build/outputs/aar/*.aar
          if-no-files-found: error

      - name: Upload JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: etebase-client-jvm-jar
          path: client-jvm/build/libs/*.jar
          if-no-files-found: error

  publish:
    name: Publish to Maven Central
    if: startsWith(github.ref, 'refs/tags/') || inputs.version
    needs: assemble
    runs-on: ubuntu-24.04
    environment: Release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned Android NDK
        run: echo y | JAVA_HOME="$JAVA_HOME_17_X64" $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;21.3.6528147"

      - name: Download native libs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: '{android,desktop}-*'
          path: artifacts/

      - name: Stage native libs and generated Java
        run: ./stage-natives.sh artifacts

      - name: Publish
        run: ./gradlew publishToMavenCentral --no-configuration-cache
        env:
          ETEBASE_VERSION: ${{ inputs.version || github.ref_name }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
